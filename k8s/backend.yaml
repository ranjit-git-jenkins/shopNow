apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnow-backend
  namespace: shopnow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopnow-backend
  template:
    metadata:
      labels:
        app: shopnow-backend
    spec:
      containers:
        - name: backend
          image: YOUR_DOCKERHUB_USERNAME/shopnow-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/shopnow
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-backend
  namespace: shopnow
spec:
  type: ClusterIP
  selector:
    app: shopnow-backend
  ports:
    - port: 5000
      targetPort: 5000
